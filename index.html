<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <link rel="icon" href="data:," />
  <title>麦子玄学 · 免费占卜</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #101128;
      --bg-deep: #21133a;
      --surface: rgba(20, 20, 48, .90);
      --surface-solid: #1a1937;
      --ink: #f5efdf;
      --muted: #c5bdcd;
      --gold: #d9b96b;
      --gold-bright: #f1d890;
      --gold-pale: #5d4826;
      --line: rgba(225, 193, 120, .30);
      --purple: #cbb7ed;
      --purple-soft: #947fbc;
      --card-back: #170e30;
      --shadow: 0 30px 90px rgba(4, 3, 16, .48);
      --danger: #efacbd;
      --serif: "Songti SC", "STSong", "Noto Serif CJK SC", serif;
      --sans: "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #090b1a;
        --bg-deep: #101027;
        --surface: rgba(19, 19, 43, .88);
        --surface-solid: #15142f;
        --ink: #f6f0df;
        --muted: #c1b9cb;
        --gold: #d9b96b;
        --gold-bright: #f0d68e;
        --gold-pale: #5b4725;
        --line: rgba(224, 190, 111, .27);
        --purple: #c9b3ed;
        --purple-soft: #8f79b9;
        --card-back: #18102f;
        --shadow: 0 30px 90px rgba(0, 0, 0, .45);
        --danger: #f0a7b8;
      }
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 10%, rgba(125, 94, 165, .14) 0 1px, transparent 1.6px) 0 0 / 34px 34px,
        radial-gradient(circle at 83% 30%, rgba(199, 157, 67, .14) 0 1px, transparent 1.5px) 0 0 / 46px 46px,
        linear-gradient(155deg, var(--bg) 0%, var(--bg-deep) 100%);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    button, input, textarea { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }

    .page {
      width: min(100% - 28px, 1040px);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 0 max(36px, env(safe-area-inset-bottom));
    }

    .masthead {
      position: relative;
      text-align: center;
      padding: 20px 12px 30px;
    }

    .masthead::before,
    .masthead::after {
      content: "";
      position: absolute;
      top: 46px;
      width: clamp(36px, 11vw, 110px);
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold));
    }
    .masthead::before { left: 2%; }
    .masthead::after { right: 2%; transform: scaleX(-1); }

    .brand-mark {
      margin: 0 0 8px;
      color: var(--gold);
      font-family: var(--serif);
      font-size: clamp(1.65rem, 6vw, 2.6rem);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.25;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(.98rem, 3.5vw, 1.16rem);
      letter-spacing: .03em;
    }

    .moon {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      margin-bottom: 8px;
      border: 1px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 13px;
      line-height: 1;
    }

    .reading-shell {
      position: relative;
      border: 1px solid var(--line);
      background: var(--surface);
      box-shadow: var(--shadow);
      padding: clamp(18px, 4vw, 38px);
      overflow: hidden;
    }

    .reading-shell::before,
    .reading-shell::after {
      content: "✦";
      position: absolute;
      color: var(--gold);
      opacity: .65;
      font-size: 13px;
    }
    .reading-shell::before { top: 11px; left: 14px; }
    .reading-shell::after { right: 14px; bottom: 11px; }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 18px;
      font-family: var(--serif);
      font-size: 1.1rem;
      color: var(--ink);
    }
    .section-heading::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .form-grid {
      display: grid;
      grid-template-columns: minmax(150px, .7fr) minmax(260px, 1.3fr);
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      color: var(--muted);
      font-size: .88rem;
    }

    .optional { color: var(--gold); font-size: .77rem; }

    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 3px;
      background: color-mix(in srgb, var(--surface-solid) 88%, transparent);
      color: var(--ink);
      outline: none;
      padding: 13px 14px;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    textarea { resize: vertical; min-height: 52px; max-height: 128px; }
    input::placeholder, textarea::placeholder { color: color-mix(in srgb, var(--muted) 72%, transparent); }
    input:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 17%, transparent);
    }

    .primary-btn, .secondary-btn, .copy-btn {
      border: 0;
      cursor: pointer;
      border-radius: 3px;
      font-weight: 700;
      letter-spacing: .06em;
      transition: transform .15s ease, filter .2s ease, background .2s ease;
    }
    .primary-btn:active, .secondary-btn:active, .copy-btn:active { transform: translateY(1px); }
    .primary-btn:focus-visible, .secondary-btn:focus-visible, .copy-btn:focus-visible, .tarot-card:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--gold-bright) 70%, white);
      outline-offset: 3px;
    }

    .primary-btn {
      display: block;
      width: min(100%, 320px);
      margin: 20px auto 0;
      padding: 14px 24px;
      color: #191124;
      background: linear-gradient(110deg, #c39a45, #f2dc98 52%, #b98932);
      box-shadow: 0 9px 26px rgba(153, 108, 29, .22);
    }
    .primary-btn:hover { filter: brightness(1.05); }
    .primary-btn:disabled { cursor: wait; filter: grayscale(.25); opacity: .75; }

    .reading-stage {
      display: none;
      padding-top: 30px;
    }
    .reading-stage.active { display: block; }

    .session-line {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 26px;
      margin-bottom: 18px;
      color: var(--muted);
      text-align: center;
      font-size: .9rem;
    }
    .session-line .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--gold); }

    .shuffle-scene {
      display: none;
      height: 238px;
      position: relative;
      place-items: center;
    }
    .shuffle-scene.active { display: grid; }
    .shuffle-card {
      position: absolute;
      width: 116px;
      aspect-ratio: 2 / 3.25;
      border: 1px solid var(--gold);
      border-radius: 7px;
      background:
        radial-gradient(circle, transparent 27%, rgba(218, 180, 99, .22) 28% 29%, transparent 30%),
        var(--card-back);
      box-shadow: 0 14px 34px rgba(0,0,0,.3);
    }
    .shuffle-card::after {
      content: "✦";
      position: absolute;
      inset: 10px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(221, 188, 116, .48);
      color: var(--gold);
      font-size: 24px;
    }
    .shuffle-card:nth-child(1) { animation: shuffleLeft .75s ease-in-out 2; }
    .shuffle-card:nth-child(2) { animation: shuffleRight .75s ease-in-out .12s 2; }
    .shuffle-card:nth-child(3) { transform: rotate(4deg); animation: shuffleTop .75s ease-in-out .2s 2; }
    .shuffle-text { position: absolute; bottom: 0; color: var(--gold); letter-spacing: .12em; font-size: .88rem; }

    .spread[hidden] { display: none; }
    .spread {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(12px, 3vw, 26px);
      align-items: start;
    }

    .card-slot {
      min-width: 0;
      text-align: center;
    }

    .position-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
      min-height: 42px;
      margin-bottom: 9px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: clamp(.78rem, 2.5vw, .98rem);
    }
    .position-label b { color: var(--gold); font-weight: 700; }

    .tarot-card {
      display: block;
      width: 100%;
      max-width: 224px;
      aspect-ratio: 2 / 3.25;
      margin: 0 auto;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      perspective: 1200px;
    }

    .card-inner {
      display: block;
      position: relative;
      width: 100%;
      height: 100%;
      transition: transform .74s cubic-bezier(.2,.68,.23,1);
      transform-style: preserve-3d;
    }
    .tarot-card.revealed .card-inner { transform: rotateY(180deg); }

    .card-side {
      display: block;
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 8px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      box-shadow: 0 14px 35px rgba(9, 5, 20, .25);
    }

    .card-back {
      background:
        radial-gradient(circle at 50% 50%, transparent 0 19%, rgba(212, 173, 90, .20) 20% 20.8%, transparent 21.3% 31%, rgba(212, 173, 90, .14) 31.4% 32.1%, transparent 32.5%),
        linear-gradient(135deg, rgba(177, 124, 53, .08) 25%, transparent 25%) 0 0 / 22px 22px,
        var(--card-back);
    }
    .card-back::before {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(230, 196, 122, .52);
      border-radius: 4px;
    }
    .card-back::after {
      content: "☾  ✦  ☽";
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: var(--gold-bright);
      font-size: clamp(16px, 4vw, 26px);
      letter-spacing: .12em;
      text-shadow: 0 0 18px rgba(222, 181, 90, .28);
    }

    .card-face {
      transform: rotateY(180deg);
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding: clamp(11px, 2.6vw, 18px);
      background:
        linear-gradient(rgba(255,255,255,.03), rgba(255,255,255,.03)),
        var(--surface-solid);
      color: var(--ink);
    }
    .roman { color: var(--gold); font-family: var(--serif); font-size: .76rem; letter-spacing: .12em; }
    .sigil {
      display: grid;
      place-items: center;
      align-self: center;
      width: min(70%, 108px);
      aspect-ratio: 1;
      margin: auto;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--gold);
      font-family: var(--serif);
      font-size: clamp(30px, 7vw, 54px);
      line-height: 1;
      position: relative;
    }
    .sigil::before, .sigil::after {
      content: "✧";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      color: var(--gold);
    }
    .sigil::before { top: -17px; }
    .sigil::after { bottom: -17px; }
    .sigil.reversed { transform: rotate(180deg); }
    .card-name { font-family: var(--serif); font-size: clamp(1rem, 3.5vw, 1.32rem); font-weight: 700; }
    .orientation {
      display: inline-block;
      margin-left: 5px;
      padding: 1px 5px;
      border: 1px solid var(--line);
      border-radius: 2px;
      color: var(--muted);
      font-family: var(--sans);
      font-size: .6em;
      vertical-align: middle;
    }

    .tap-hint {
      min-height: 25px;
      margin: 9px 0 0;
      color: var(--gold);
      font-size: .78rem;
    }
    .tarot-card:not(.revealed):not(.locked):hover { transform: translateY(-4px); }
    .tarot-card { transition: transform .2s ease; }
    .tarot-card.locked { cursor: default; opacity: .66; }

    .guidance {
      min-height: 112px;
      margin: 10px 0 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(.9rem, 2.5vw, 1rem);
      opacity: 0;
      transform: translateY(-5px);
      transition: opacity .35s ease .35s, transform .35s ease .35s;
    }
    .revealed + .tap-hint + .guidance { opacity: 1; transform: translateY(0); }
    .guidance-keyword { margin: 0; color: var(--gold-bright); font-weight: 700; }
    .guidance-detail { margin: 8px 0 0; color: var(--muted); font-family: var(--sans); font-size: .86em; line-height: 1.7; text-align: left; }

    .overall-guidance {
      display: none;
      width: min(100%, 760px);
      margin: 26px auto 6px;
      padding: 22px clamp(16px, 4vw, 28px);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .overall-guidance.visible { display: block; animation: resultIn .55s ease both; }
    .overall-title { margin: 0 0 10px; color: var(--gold); font-family: var(--serif); font-size: 1.08rem; }
    .overall-guidance p { margin: 8px 0 0; color: var(--muted); font-family: var(--serif); font-size: .94rem; line-height: 1.8; }

    .deck-controls { display: none; justify-content: center; margin-top: 18px; }
    .deck-controls.visible { display: flex; }
    .secondary-btn {
      padding: 11px 22px;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
    }
    .secondary-btn:hover { background: color-mix(in srgb, var(--gold) 9%, transparent); }

    .conversion {
      display: none;
      position: relative;
      margin-top: 28px;
      padding: clamp(22px, 5vw, 36px);
      border-top: 1px solid var(--line);
      text-align: center;
    }
    .conversion.visible { display: block; animation: resultIn .55s ease both; }
    .conversion-quote {
      max-width: 650px;
      margin: 0 auto 24px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(1.12rem, 4vw, 1.55rem);
      line-height: 1.75;
    }
    .conversion-quote strong { color: var(--gold); font-weight: 700; }

    .offer {
      width: min(100%, 540px);
      margin: 0 auto;
      padding: 24px clamp(17px, 5vw, 34px);
      border: 1px solid var(--line);
      background: color-mix(in srgb, var(--purple) 9%, transparent);
    }
    .offer-title { margin: 0; color: var(--gold); font-family: var(--serif); font-size: 1.25rem; }
    .offer-desc { margin: 4px 0 15px; color: var(--muted); font-size: .9rem; }
    .price-row { display: flex; justify-content: center; align-items: baseline; gap: 8px; margin-bottom: 17px; }
    .price { color: var(--ink); font-family: var(--serif); font-size: 2.15rem; font-weight: 700; line-height: 1; }
    .price small { font-family: var(--sans); font-size: .78rem; }
    .limited { color: var(--danger); font-size: .76rem; }

    .copy-btn {
      width: min(100%, 340px);
      padding: 13px 18px;
      background: var(--gold);
      color: #16101f;
    }
    .copy-btn:hover { filter: brightness(1.07); }
    .wechat-line { margin: 11px 0 0; color: var(--muted); font-size: .83rem; }
    .wechat-id { color: var(--ink); font-weight: 700; user-select: all; }
    .wechat-hint { max-width: 410px; margin: 8px auto 0; color: var(--muted); font-size: .78rem; line-height: 1.65; }
    .copy-status { min-height: 24px; margin: 6px 0 0; color: var(--gold); font-size: .8rem; }

    footer { padding: 24px 10px 0; text-align: center; color: var(--muted); font-size: .74rem; }

    @keyframes shuffleLeft {
      0%, 100% { transform: translateX(0) rotate(-4deg); }
      45% { transform: translateX(-65px) rotate(-12deg); }
      75% { transform: translateX(20px) rotate(5deg); }
    }
    @keyframes shuffleRight {
      0%, 100% { transform: translateX(0) rotate(2deg); }
      45% { transform: translateX(65px) rotate(12deg); }
      75% { transform: translateX(-20px) rotate(-5deg); }
    }
    @keyframes shuffleTop {
      0%, 100% { transform: translateY(0) rotate(4deg); }
      50% { transform: translateY(-24px) rotate(0); }
    }
    @keyframes cardBreathe {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes resultIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 700px) {
      .page { width: min(100% - 20px, 520px); padding-top: max(20px, env(safe-area-inset-top)); }
      .masthead { padding: 13px 4px 24px; }
      .masthead::before, .masthead::after { top: 37px; width: 28px; }
      .form-grid { grid-template-columns: 1fr; }
      .reading-shell { padding: 18px 13px 23px; }
      .reading-stage { padding-top: 24px; }
      .spread { grid-template-columns: 1fr; gap: 30px; }
      .position-label { gap: 7px; min-height: 34px; }
      .tarot-card { max-width: 202px; }
      .card-side { border-radius: 6px; }
      .card-face { padding: 11px 9px; }
      .sigil { width: 62%; }
      .guidance { width: min(100%, 350px); min-height: 0; margin: 12px auto 0; font-size: .9rem; line-height: 1.58; }
      .guidance-detail { font-size: .9em; line-height: 1.62; }
      .tap-hint { font-size: .76rem; }
      .conversion { padding-left: 2px; padding-right: 2px; }
    }

    @media (max-width: 380px) {
      .page { width: min(100% - 12px, 520px); }
      .reading-shell { padding-left: 9px; padding-right: 9px; }
      .spread { gap: 5px; }
      .card-name { font-size: .92rem; }
      .guidance { font-size: .88rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead" aria-labelledby="page-title">
      <span class="moon" aria-hidden="true">✦</span>
      <h1 class="brand-mark" id="page-title">麦子玄学 · 免费占卜</h1>
      <p class="subtitle">抽三张牌，看看宇宙想告诉你什么。</p>
    </header>

    <section class="reading-shell" aria-label="三张牌占卜">
      <div class="input-panel" id="inputPanel">
        <h2 class="section-heading">在心里放下你的问题</h2>
        <div class="form-grid">
          <label>
            <span>昵称 <span class="optional">选填</span></span>
            <input id="nickname" type="text" maxlength="20" autocomplete="nickname" placeholder="怎么称呼你" />
          </label>
          <label>
            <span>你想问的问题 <span class="optional">选填</span></span>
            <input id="question" type="text" maxlength="80" placeholder="例如：最近工作运怎么样" />
          </label>
        </div>
        <button class="primary-btn" id="startBtn" type="button">开始占卜</button>
      </div>

      <div class="reading-stage" id="readingStage" aria-live="polite">
        <div class="session-line" id="sessionLine"></div>

        <div class="shuffle-scene" id="shuffleScene" aria-label="正在洗牌">
          <div class="shuffle-card" aria-hidden="true"></div>
          <div class="shuffle-card" aria-hidden="true"></div>
          <div class="shuffle-card" aria-hidden="true"></div>
          <div class="shuffle-text">正在洗牌，请静心片刻</div>
        </div>

        <div class="spread" id="spread" hidden>
          <article class="card-slot">
            <div class="position-label"><b>第一张</b><span>现状</span></div>
            <button class="tarot-card" type="button" data-index="0" aria-label="翻开第一张牌：现状">
              <span class="card-inner">
                <span class="card-side card-back"></span>
                <span class="card-side card-face">
                  <span class="roman"></span>
                  <span class="sigil"></span>
                  <span class="card-name"></span>
                </span>
              </span>
            </button>
            <p class="tap-hint">点击翻牌</p>
            <div class="guidance" aria-live="polite"></div>
          </article>

          <article class="card-slot">
            <div class="position-label"><b>第二张</b><span>挑战</span></div>
            <button class="tarot-card locked" type="button" data-index="1" aria-label="第二张牌：挑战，请先翻第一张" aria-disabled="true">
              <span class="card-inner">
                <span class="card-side card-back"></span>
                <span class="card-side card-face">
                  <span class="roman"></span>
                  <span class="sigil"></span>
                  <span class="card-name"></span>
                </span>
              </span>
            </button>
            <p class="tap-hint">等待翻牌</p>
            <div class="guidance" aria-live="polite"></div>
          </article>

          <article class="card-slot">
            <div class="position-label"><b>第三张</b><span>指引</span></div>
            <button class="tarot-card locked" type="button" data-index="2" aria-label="第三张牌：指引，请先翻第二张" aria-disabled="true">
              <span class="card-inner">
                <span class="card-side card-back"></span>
                <span class="card-side card-face">
                  <span class="roman"></span>
                  <span class="sigil"></span>
                  <span class="card-name"></span>
                </span>
              </span>
            </button>
            <p class="tap-hint">等待翻牌</p>
            <div class="guidance" aria-live="polite"></div>
          </article>
        </div>

        <section class="overall-guidance" id="overallGuidance" aria-labelledby="overall-title">
          <h3 class="overall-title" id="overall-title">综合指引</h3>

          reversed: "这里面有不公平，也有人没说实话。你要是装没看见，吃亏的就是你。先把聊天、合同和钱款查清楚，别稀里糊涂认了。"

          reversed: "你已经让步太多了，再让就不是体谅，是委屈自己。对方习惯了你兜底，自然不会主动改变。该收回的付出收回来，别继续当老好人。"

          reversed: "你明知道有些东西早该放下了，手就是松不开。拖着拖着，耗的全是你自己。长痛不如短痛，该翻篇就翻篇，别回头。"

          reversed: "离结束就差一点，但偏偏卡在收尾。别嫌最后这些小事麻烦，烂尾才是真的亏。把欠的步骤补齐，别临门一脚往回走。"

      var startBtn = document.getElementById("startBtn");
      var redrawBtn = document.getElementById("redrawBtn");
      var readingStage = document.getElementById("readingStage");
      var shuffleScene = document.getElementById("shuffleScene");
      var spread = document.getElementById("spread");
      var sessionLine = document.getElementById("sessionLine");
      var deckControls = document.getElementById("deckControls");
      var overallGuidance = document.getElementById("overallGuidance");
      var overallBody = document.getElementById("overallBody");
      var conversion = document.getElementById("conversion");
      var copyBtn = document.getElementById("copyBtn");
      var copyStatus = document.getElementById("copyStatus");
      var cards = Array.prototype.slice.call(document.querySelectorAll(".tarot-card"));
      var currentDraw = [];
      var nextIndex = 0;
      var shuffleTimer = null;

      function randomInt(max) {
        if (window.crypto && window.crypto.getRandomValues) {
          var bucket = new Uint32Array(1);
          window.crypto.getRandomValues(bucket);
          return bucket[0] % max;
        }
        return Math.floor(Math.random() * max);
      }

      function drawThree() {
        var pool = deck.slice();
        var draw = [];
        for (var i = 0; i < 3; i += 1) {
          var pick = randomInt(pool.length);
          var card = pool.splice(pick, 1)[0];
          draw.push({
            name: card.name,
            roman: card.roman,
            sigil: card.sigil,
            upright: card.upright,
            reversed: card.reversed,
            isReversed: randomInt(2) === 1
          });
        }
        return draw;
      }

      function setSessionLine() {
        var name = document.getElementById("nickname").value.trim();
        var question = document.getElementById("question").value.trim();
        sessionLine.textContent = "";
        if (name) {
          var n = document.createElement("span");
          n.textContent = name + " 的牌面";
          sessionLine.appendChild(n);
        }
        if (name && question) {
          var d = document.createElement("span");
          d.className = "dot";
          d.setAttribute("aria-hidden", "true");
          sessionLine.appendChild(d);
        }
        if (question) {
          var q = document.createElement("span");
          q.textContent = "所问：" + question;
          sessionLine.appendChild(q);
        }
        if (!name && !question) sessionLine.textContent = "你的三张牌已经选定";
      }

      function resetCards() {
        nextIndex = 0;
        conversion.classList.remove("visible");
        overallGuidance.classList.remove("visible");
        overallBody.textContent = "";
        deckControls.classList.remove("visible");
        copyStatus.textContent = "";
        cards.forEach(function (button, index) {
          var slot = button.closest(".card-slot");
          button.classList.remove("revealed");
          button.classList.add("locked");
          button.setAttribute("aria-disabled", "true");
          button.setAttribute("aria-label", index === 0 ? "第一张牌：现状，洗牌完成后可翻开" : (index === 1 ? "第二张牌：挑战，请先翻第一张" : "第三张牌：指引，请先翻第二张"));
          button.querySelector(".card-face").setAttribute("aria-hidden", "true");
          slot.querySelector(".tap-hint").textContent = "等待翻牌";
          slot.querySelector(".guidance").textContent = "";
        });
      }

      function prepareFaces() {
        cards.forEach(function (button, index) {
          var card = currentDraw[index];
          var face = button.querySelector(".card-face");
          var sigil = face.querySelector(".sigil");
          face.querySelector(".roman").textContent = card.roman;
          sigil.textContent = card.sigil;
          sigil.classList.toggle("reversed", card.isReversed);
          face.querySelector(".card-name").innerHTML = "";
          var nameNode = document.createTextNode(card.name + " ");
          var badge = document.createElement("span");
          badge.className = "orientation";
          badge.textContent = card.isReversed ? "逆位" : "正位";
          face.querySelector(".card-name").appendChild(nameNode);
          face.querySelector(".card-name").appendChild(badge);
        });
      }

      function beginReading() {
        if (shuffleTimer) window.clearTimeout(shuffleTimer);
        startBtn.disabled = true;
        startBtn.textContent = "正在洗牌…";
        currentDraw = drawThree();
        resetCards();
        prepareFaces();
        setSessionLine();
        readingStage.classList.add("active");
        spread.hidden = true;
        shuffleScene.classList.add("active");
        readingStage.scrollIntoView({ behavior: "smooth", block: "start" });

        shuffleTimer = window.setTimeout(function () {
          shuffleScene.classList.remove("active");
          spread.hidden = false;
          startBtn.disabled = false;
          startBtn.textContent = "开始占卜";
          cards[0].classList.remove("locked");
          cards[0].setAttribute("aria-disabled", "false");
          cards[0].setAttribute("aria-label", "翻开第一张牌：现状");
          cards[0].closest(".card-slot").querySelector(".tap-hint").textContent = "点击翻牌";
          cards[0].focus({ preventScroll: true });
        }, 1700);
      }

      function getInterpretation(card) {
        return card.isReversed ? card.reversed : card.upright;
      }

      function getOrientation(card) {
        return card.isReversed ? "逆位" : "正位";
      }

      function firstSentence(text) {
        var stop = text.indexOf("。");
        return stop === -1 ? text : text.slice(0, stop);
      }

      function lastSentence(text) {
        var clean = text.replace(/。+$/, "");
        var parts = clean.split("。");
        return parts[parts.length - 1];
      }

      function buildExpansion(card) {
        return getInterpretation(card);
      }

      function renderCardGuidance(slot, card, index) {
        var box = slot.querySelector(".guidance");
        var keyword = document.createElement("p");
        var detail = document.createElement("p");
        var labels = ["现在怎么说", "真正卡在哪儿", "接下来怎么做"];
        keyword.className = "guidance-keyword";
        detail.className = "guidance-detail";
        keyword.textContent = labels[index];
        detail.textContent = buildExpansion(card);
        box.textContent = "";
        box.appendChild(keyword);
        box.appendChild(detail);
      }

      function renderOverallGuidance() {
        var currentCard = currentDraw[0];
        var challengeCard = currentDraw[1];
        var directionCard = currentDraw[2];
        var nickname = document.getElementById("nickname").value.trim();
        var question = document.getElementById("question").value.trim();
        var first = document.createElement("p");
        var second = document.createElement("p");
        var third = document.createElement("p");
        var fourth = document.createElement("p");
        var fifth = document.createElement("p");
        var callback = nickname ? nickname + "，" : "";

        if (question) {
          callback += "你问的是“" + question + "”，这三张牌其实已经把答案摆出来了。";
        } else {
          callback += "你心里惦记的这件事，这三张牌其实已经把答案摆出来了。";
        }

        first.textContent = callback;
        second.textContent = "现状是" + currentCard.name + getOrientation(currentCard) + "：" + firstSentence(getInterpretation(currentCard)) + "。";
        third.textContent = "真正卡你的地方在" + challengeCard.name + getOrientation(challengeCard) + "：" + firstSentence(getInterpretation(challengeCard)) + "。";
        fourth.textContent = "出路牌是" + directionCard.name + getOrientation(directionCard) + "：" + firstSentence(getInterpretation(directionCard)) + "。所以你接下来要做的是：" + lastSentence(getInterpretation(directionCard)) + "。";
        fifth.textContent = "记住，牌是死的，人是活的，怎么打看你咋打。想看得更准、更贴你个人的，加我微信，我给你细看。";

        overallBody.textContent = "";
        overallBody.appendChild(first);
        overallBody.appendChild(second);
        overallBody.appendChild(third);
        overallBody.appendChild(fourth);
        overallBody.appendChild(fifth);
        overallGuidance.classList.add("visible");
      }

      function revealCard(index) {
        if (index !== nextIndex) return;
        var button = cards[index];
        var card = currentDraw[index];
        var slot = button.closest(".card-slot");
        var orientation = card.isReversed ? "逆位" : "正位";
        var positions = ["现状", "挑战", "指引"];

        button.classList.add("revealed");
        button.classList.remove("locked");
        button.querySelector(".card-face").setAttribute("aria-hidden", "false");
        button.setAttribute("aria-disabled", "true");
        button.setAttribute("aria-label", card.name + orientation + "，" + (card.isReversed ? card.reversed : card.upright));
        slot.querySelector(".tap-hint").textContent = card.name + " · " + orientation;
        renderCardGuidance(slot, card, index);
        nextIndex += 1;

        if (nextIndex < cards.length) {
          var next = cards[nextIndex];
          next.classList.remove("locked");
          next.setAttribute("aria-disabled", "false");
          next.setAttribute("aria-label", "翻开第" + (nextIndex + 1) + "张牌：" + positions[nextIndex]);
          next.closest(".card-slot").querySelector(".tap-hint").textContent = "点击翻牌";
        } else {
          renderOverallGuidance();
          deckControls.classList.add("visible");
          window.setTimeout(function () {
            conversion.classList.add("visible");
            overallGuidance.scrollIntoView({ behavior: "smooth", block: "start" });
          }, 620);
        }
      }

      function copyWechat() {
        var value = copyBtn.getAttribute("data-wechat");
        var opened = false;

        function openWechat() {
          if (opened) return;
          opened = true;
          copyBtn.textContent = "正在打开微信…";
          window.setTimeout(function () {
            var launchLink = document.createElement("a");
            launchLink.href = "weixin://";
            launchLink.rel = "noopener";
            launchLink.style.display = "none";
            document.body.appendChild(launchLink);
            launchLink.click();
            launchLink.remove();
          }, 160);
          window.setTimeout(function () {
            copyBtn.textContent = "一键添加微信";
          }, 2200);
        }

        function done() {
          copyStatus.textContent = "微信号已复制，正在尝试打开微信";
          openWechat();
        }

        function fallback() {
          var area = document.createElement("textarea");
          var copied = false;
          area.value = value;
          area.setAttribute("readonly", "");
          area.style.position = "fixed";
          area.style.opacity = "0";
          document.body.appendChild(area);
          area.select();
          try {
            copied = document.execCommand("copy");
          } catch (error) {
            copied = false;
          }
          area.remove();
          copyStatus.textContent = copied ? "微信号已复制，正在尝试打开微信" : "未能自动复制，请长按下方微信号复制";
          openWechat();
        }

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(value).then(done).catch(fallback);
        } else {
          fallback();
        }
      }

      startBtn.addEventListener("click", beginReading);
      redrawBtn.addEventListener("click", beginReading);
      copyBtn.addEventListener("click", copyWechat);
      cards.forEach(function (button) {
        button.addEventListener("click", function () {
          revealCard(Number(button.getAttribute("data-index")));
        });
      });
    }());
  </script>
</body>
</html>
