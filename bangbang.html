<title>邦邦工作室 | 独立游戏</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#fff8e8;color:#5b4632;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:0 20px}
header{text-align:center;padding:48px 0 24px}
.logo{width:120px;height:120px;border-radius:28px;border:4px solid #9a3412;box-shadow:0 4px 12px rgba(90,60,30,.25);image-rendering:pixelated}
h1{font-size:38px;margin:16px 0 8px;color:#c2410c;letter-spacing:4px}
.tag{font-size:16px;color:#a08060}
.hero{background:#c2410c;color:#fff8e8;border-radius:20px;padding:28px 24px;margin:24px 0;text-align:center}
.hero p{font-size:16px;line-height:1.9}
.btn{display:inline-block;margin-top:16px;background:#fb923c;color:#5b4632;font-weight:bold;font-size:17px;padding:12px 36px;border-radius:999px;text-decoration:none;border:3px solid #9a3412}
.btn:active{transform:scale(.96)}
h2{font-size:22px;margin:32px 0 16px;color:#c2410c;border-left:6px solid #fb923c;padding-left:12px}
.game{background:#fff;border:3px solid #e8c87e;border-radius:16px;padding:20px;margin-bottom:16px}
.game h3{font-size:19px;margin-bottom:8px}
.game .status{display:inline-block;font-size:13px;background:#fb923c;color:#5b4632;border-radius:999px;padding:3px 12px;margin-bottom:10px;font-weight:bold}
.game p{font-size:14px;line-height:1.8;color:#7a6248}
.about p{font-size:15px;line-height:2;color:#7a6248}
footer{text-align:center;padding:36px 0 48px;font-size:13px;color:#b09a7a}
</style>
